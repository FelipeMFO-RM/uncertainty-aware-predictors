# config/config_script_annealing_uncertainty.yaml
identifier: LT-16_0
output_path: data/enriched/mbc_annealing_uncertainty_script_results
# Each bundle dir holds artifacts.pkl + model_a/ + model_b/
# Point these at the run folders produced by Section 10 of the annealing
# notebooks, or any <run_dir> from ExperimentRunner. If you point at a TAG
# folder (multiple runs inside), the script auto-picks the best run by RMSE.
bundle_dirs:
  iacs: models/annealing_iacs/notebook_170826
  uts:  models/annealing_uts/experiments/annealing-schema110826
best_metric: rmse  # metric used to auto-pick the best run from a TAG folder
# Serial-number encoding schema: drives the IRI / GBEI chemical features that
# the current annealing surrogates take as inputs. Omit the key to skip the
# step (older bundles trained without IRI/GBEI).
# sn_schema_path: data/structured/serial-number-encoding_020926.csv
# Fixed material state: every non-grid feature the surrogates need.
# IACS needs: purity, iacs        UTS needs: purity, initial_diameter, tensile_strength
# material_reference is what the chemical features are derived from.
material_properties:
  purity: 99.726
  iacs: 95.61
  initial_diameter: 2.0
  tensile_strength: 399.32
operational_limits:
  temperature: [473, 873]   # Kelvin
  time: [30, 120]           # minutes
step:
  temperature: 10
  time: 5
# Keys are surrogate SHORT NAMES (target minus '_final'), not the bundle
# aliases above: the 'uts' bundle has short name 'tensile_strength'.
min_setpoints:       # floors: Pr(Y >= value), ranked on {t}_lcb
  iacs: 101
  tensile_strength: 220.0
max_setpoints: {}    # ceilings: Pr(Y <= value), ranked on {t}_ucb
                     # e.g.  elongation: 50.0  (needs an elongation bundle)
delta: 0.4       # keep cells with Pr(all setpoints) >= 1 - delta
kappa: 1.645       # one-sided 95% confidence bound for risk ranking
ood_gamma: 1.0     # OOD sigma-inflation strength
selection_spec_low:
  lowest_time: time
  lowest_temperature: temperature
  lowest_cost: cost
  lowest_cost_phys: cost_phys
# safest_<target>, safest_combined and most_margin_<target> are generated from
# the validated setpoint keys; selection_spec_high is only for extra criteria.
save_feasibility_map: true   # 6.1 heatmap as a PNG next to the CSVs
inspect_pairs:               # section 9; omit the key to skip the dump
  temperatures: [573, 623, 673]
  times: [30, 60, 90]
